name: newapi.ai auto checkin

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      accounts:
        description: 'Account config (JSON, optional, uses secrets.ACCOUNTS if empty)'
        required: false
        type: string
        default: ''
      providers:
        description: 'Custom Provider config (JSON, optional, uses secrets.PROVIDERS if empty)'
        required: false
        type: string
        default: ''
      debug:
        description: 'Debug mode (save screenshots and HTML logs)'
        required: false
        type: boolean
        default: false

jobs:
  checkin:
    runs-on: windows-latest
    environment: production
    steps:
      - name: Set Beijing timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: Asia/Shanghai
          timezoneMacos: Asia/Shanghai
          timezoneWindows: China Standard Time

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache UV dependencies
        id: uv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        if: steps.uv-cache.outputs.cache-hit != 'true'
        run: uv sync

      - name: Get Camoufox version
        id: camoufox-version
        run: |
          $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('camoufox'))"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Camoufox browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.camoufox
          key: camoufox-${{ runner.os }}-${{ steps.camoufox-version.outputs.version }}

      - name: Install Camoufox browser
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        run: uv run camoufox fetch

      - name: Restore login state cache
        uses: actions/cache/restore@v4
        with:
          path: storage-states
          key: storage-state-${{ hashFiles('storage-states/*.json') }}
          restore-keys: |
            storage-state-

      - name: Restore balance history cache
        uses: actions/cache/restore@v4
        with:
          path: balance_hash.txt
          key: balance-hash-${{ hashFiles('balance_hash.txt') }}

      - name: Run checkin
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          PROVIDERS: ${{ secrets.PROVIDERS }}
          ACCOUNTS_GITHUB: ${{ secrets.ACCOUNTS_GITHUB }}
          ACCOUNTS_LINUX_DO: ${{ secrets.ACCOUNTS_LINUX_DO }}
          PROXY: ${{ secrets.PROXY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
          DEBUG: ${{ inputs.debug }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          ACCOUNTS_INPUT: ${{ inputs.accounts }}
          PROVIDERS_INPUT: ${{ inputs.providers }}
        run: |
          if (Test-Path "storage-states") {
            echo "storage-states directory exists"
            Get-ChildItem -Path storage-states -File | ForEach-Object { echo "  - $($_.Name)" }
          } else {
            echo "storage-states directory does not exist"
          }
          uv run python main.py

      - name: Save login state cache
        if: always() && hashFiles('storage-states/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: storage-states
          key: storage-state-${{ hashFiles('storage-states/*.json') }}

      - name: Save balance history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: balance_hash.txt
          key: balance-hash-${{ hashFiles('balance_hash.txt') }}

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.run_number }}
          path: |
            logs/
            screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Result
        if: always()
        run: |
          echo "Checkin task completed"
          echo "Time: $(Get-Date)"
